name: Build pin feeds
# Builds one RSS feed per board from pins.json and deploys it to GitHub Pages (Settings > Pages >
# Source: GitHub Actions). Runs on every push and once a day, so each pin enters its feed on its
# publish_after date. Pinterest auto-publish reads the feeds. No secrets or tokens are involved.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 13 * * *"   # daily, about 8:17 AM Chicago time
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build the feeds
        run: python3 build_feed.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
